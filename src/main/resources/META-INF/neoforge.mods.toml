modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/CAS-ual-TY/ProjectilesBounceOffSlimeBlocks/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/CAS-ual-TY/ProjectilesBounceOffSlimeBlocks"
    logoFile="logo.png"
    credits="Mojang and the NeoForged Team"
    authors="CAS_ual_TY"
    description='''Makes all projectiles (eg. Arrows, Tridents, ...) bounce off slime blocks.'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"